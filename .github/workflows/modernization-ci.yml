name: modernization-ci

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'copilot/**'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modernization
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore GlobalSoft.Modernization.slnx

      - name: Build
        run: dotnet build GlobalSoft.Modernization.slnx --no-restore

      - name: Test
        run: dotnet test GlobalSoft.Modernization.slnx --no-build

      - name: Smoke test local SQLite store
        run: dotnet run --project src/GlobalSoft.Modernization.Local --no-build -- /tmp/globalsoft-local.db

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Build admin web
        working-directory: modernization/admin-web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Validate prohibited files
        run: ./scripts/validate-prohibited-files.sh
